[project]
name = "knowledge-assistant-api"
version = "1.0.0"
description = "Local RAG question-answering API (FastAPI + Ollama + ChromaDB + Sentence Transformers)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "chromadb>=1.0,<2",
    "sentence-transformers>=3.0,<6",
    "ollama>=0.5,<1",
    "httpx>=0.27,<1",
    "pypdf>=5.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
